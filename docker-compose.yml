services:
  ginti:
    build: .
    ports:
      # Localhost only by default. To serve a classroom LAN, change to "8000:8000" and put TLS in front (see SECURITY.md).
      - "127.0.0.1:8000:8000"
    environment:
      # Optional. If empty, a random PIN is generated and printed in the log.
      TEACHER_PIN: ${TEACHER_PIN:-}
    volumes:
      - ginti-data:/data
    restart: unless-stopped

volumes:
  ginti-data:
