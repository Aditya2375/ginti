name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}
      - run: pip install -r requirements-dev.txt
      - run: python scripts/fetch_models.py models
      - run: python -m pytest -q tests
        env:
          GINTI_MODEL_DIR: models

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up (no .env, no keys)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: smoke test against the running container
        run: python3 scripts/smoke.py http://127.0.0.1:8000
      - name: container logs
        if: always()
        run: docker compose logs --no-color
      - run: docker compose down -v
